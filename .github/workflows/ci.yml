name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ray's uv runtime-env hook probes the process tree, which fails on hosted
  # runners; the integration does not need it.
  RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create environment
        run: |
          uv venv --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    # A deadlocked Ray/LanceDB worker otherwise holds the runner until the
    # six-hour default; pytest's own --timeout should fire first and print
    # tracebacks, and this is the backstop.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create environment
        run: |
          uv venv --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Test
        # Live Enterprise tests skip automatically without credentials.
        run: pytest -v
