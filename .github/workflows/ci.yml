name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow re-runs this whole suite against the tagged commit
  # before anything is uploaded to PyPI.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ray's uv runtime-env hook probes the process tree, which fails on hosted
  # runners; the integration does not need it.
  RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create environment
        run: |
          uv venv --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    # A deadlocked Ray/LanceDB worker otherwise holds the runner until the
    # six-hour default; pytest's own --timeout should fire first and print
    # tracebacks, and this is the backstop.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create environment
        run: |
          uv venv --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Test
        # Live Enterprise tests skip automatically without credentials.
        run: pytest -v

  # Packaging breaks quietly: a missing file or bad metadata only shows up at
  # upload time, when the version number has already been burned. Build the
  # real artifacts on every change instead.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Check the distribution metadata
        run: uvx twine check --strict dist/*
      # --no-deps keeps this to seconds: the point is the artifact, not Ray.
      # It proves the wheel installs, that its distribution name resolves
      # (which is where __version__ comes from), and that py.typed shipped —
      # without the marker every downstream type checker silently ignores us.
      - name: Install the built wheel and check what it shipped
        run: |
          uv venv --python 3.12 /tmp/wheel-check
          VIRTUAL_ENV=/tmp/wheel-check uv pip install --no-deps dist/*.whl
          /tmp/wheel-check/bin/python - <<'PY'
          from importlib.metadata import files, version

          print(version("lancedb-ray"))
          shipped = {f.name for f in files("lancedb-ray") or ()}
          assert "py.typed" in shipped, "the wheel is missing py.typed"
          PY

  benchmark:
    runs-on: ubuntu-latest
    # The ci tier budgets ~8 minutes of work; this is the backstop for a
    # deadlocked Ray worker, the same failure mode the test job guards against.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create environment
        run: |
          uv venv --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install
        run: uv pip install -e ".[dev]"

      - name: Benchmark
        env:
          # Everything the run writes goes under the runner's temp directory,
          # never the workspace, so a leak is impossible to miss and impossible
          # to commit.
          BENCH_RUN_ROOT: ${{ runner.temp }}/bench
          BENCH_OUT_DIR: ${{ runner.temp }}/bench-results
        run: |
          python -m benchmarks \
            --tier ci \
            --compare benchmarks/baselines/ci-ubuntu-latest.json \
            --regression-factor 2.5 \
            --junit "$RUNNER_TEMP/bench-results/benchmarks.xml" \
            --step-summary "$RUNNER_TEMP/bench-results/summary.md"

      - name: Job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/bench-results/summary.md" ]; then
            cat "$RUNNER_TEMP/bench-results/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: ${{ runner.temp }}/bench-results
          retention-days: 30
          if-no-files-found: warn

      - name: Verify the run cleaned up after itself
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/bench" "${RUNNER_TEMP}/bench-results"
          leftovers="$(git status --porcelain)"
          if [ -n "$leftovers" ]; then
            echo "benchmark run left files in the working tree:"
            echo "$leftovers"
            exit 1
          fi
          echo "working tree clean"
