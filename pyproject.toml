[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lancedb-ray"
version = "0.1.0"
description = "Ray Data integration for LanceDB and LanceDB Enterprise"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Justin Miller" }]
keywords = ["ray", "lancedb", "lance", "vector-database", "distributed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Pinned exactly: ray.data.llm renamed build_llm_processor to
    # build_processor between releases, so the LLM example is tied to one
    # version. A floor let the environment drift to 2.50 and break it.
    "ray[data]==2.58.0",
    "lancedb>=0.24.0",
    "lance-ray>=0.5.0",
    "pyarrow>=17.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "pytest-timeout>=2.3.0",
    "mypy>=1.11.0",
    "ruff>=0.8.0",
    "pandas>=2.0.0",
    # The MCAP example is tested in CI, unlike the examples whose dependencies
    # are model-sized. mcap is pure Python and pulls in only its compression
    # codecs, so it is cheap enough to keep in the dev environment.
    "mcap>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/justinrmiller/lancedb-ray"
Repository = "https://github.com/justinrmiller/lancedb-ray"

[tool.setuptools.packages.find]
where = ["."]
include = ["lancedb_ray*"]

[tool.ruff]
line-length = 88
target-version = "py312"
# examples/mcap_ingest is named directly as well as via examples/: its modules
# are imported flat (the way a Ray worker loads them), so isort only sees them
# as first-party if the directory itself is a source root.
src = ["lancedb_ray", "tests", "examples", "examples/mcap_ingest", "benchmarks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "UP045", "UP007"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=lancedb_ray",
    # The MCAP example is covered like library code, because it is library-
    # shaped: people copy it. The other examples need models or credentials to
    # run at all, so they stay outside the gate.
    "--cov=examples/mcap_ingest",
    "--cov-report=term-missing",
    # Set just below where the suite actually sits, so a real
    # regression trips it but ordinary churn does not.
    "--cov-fail-under=95",
    # Ray forks workers and LanceDB's async runtime is only experimentally
    # fork-safe, so a task can deadlock. Fail the test with thread tracebacks
    # instead of stalling the run until the CI job is killed.
    "--timeout=300",
    "--timeout-method=thread",
]
markers = [
    "enterprise: live tests against a real LanceDB Cloud/Enterprise endpoint (needs LANCEDB_URI + LANCEDB_API_KEY)",
]

[tool.coverage.run]
source = ["lancedb_ray", "examples/mcap_ingest"]
# The benchmark suite is tooling, exercised by being run rather than by the
# unit tests, so it is not part of the coverage gate.
omit = ["*/tests/*", "*/benchmarks/*"]
# Line coverage alone hides half-tested conditionals: a branch whose true arm
# runs and whose false arm never does still counts every line as covered.
branch = true

[tool.coverage.report]
# A module's CLI entry point is exercised by calling main() directly; the
# guard itself only runs under ``python file.py``.
exclude_also = ['if __name__ == "__main__":']

[tool.mypy]
# No python_version pin: it must match the interpreter actually running mypy,
# because some installed stubs (numpy) use syntax newer than our floor.
# Ruff's target-version = "py312" is what enforces the language floor.
files = ["lancedb_ray", "tests", "examples", "benchmarks"]
# Test helpers and example modules are imported flat (not as tests.* or
# examples.*) because Ray workers load them that way, so mypy needs the same
# search path. Example module names are kept globally unique to match.
# ``benchmarks`` reuses the test suite's fake Cloud/Enterprise backend, which is
# imported flat (``_fakes``) because Ray workers load it that way.
mypy_path = [
    "tests",
    "examples/clip_image_search",
    "examples/mcap_ingest",
    "examples/vllm_generate_embed",
]
strict = true
warn_unused_ignores = false

# mcap's writer does ``from .__init__ import __version__``, which makes mypy
# see mcap/__init__.py under two module names and refuse to build anything at
# all. Skipping the package sidesteps its packaging bug; it also means mcap's
# API arrives as Any, which is how every other untyped dependency here is
# already treated.
[[tool.mypy.overrides]]
module = ["mcap.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "lancedb.*",
    "lance.*",
    "lance_ray.*",
    "ray.*",
    "pyarrow.*",
    "pandas.*",
    "psutil.*",
]
ignore_missing_imports = true

# The clip_image_search example's dependencies are deliberately not part of
# [dev]: they are large (torch alone is hundreds of MB) and only that one
# example needs them. Lint must therefore pass without them installed.
[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "PIL.*", "streamlit.*"]
ignore_missing_imports = true
