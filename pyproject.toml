[build-system]
# 77 is the floor for PEP 639: below it, the SPDX ``license`` string and
# ``license-files`` below are either rejected or silently reinterpreted as the
# legacy free-text field, so the published metadata would depend on whatever
# setuptools the build environment happened to resolve.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lancedb-ray"
# Managed by release-please: the release PR rewrites this line and the
# matching entry in .release-please-manifest.json. Do not bump it by hand.
version = "0.1.0"
description = "Ray Data integration for LanceDB and LanceDB Enterprise"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Justin Miller" }]
keywords = ["ray", "lancedb", "lance", "vector-database", "distributed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # The floor is the oldest Ray the whole test suite passes on; the
    # test-ray-floor CI job installs exactly this version to keep it true.
    # 2.53 is the first Ray to pass the dataset's schema to
    # Datasink.on_write_start. On 2.52, a write that has to create the table
    # fails unless the caller passes schema= (every Cloud/Enterprise create,
    # and some local ones); older releases also break upserts and projection.
    # No upper bound: a Ray client must match its cluster's version, so a cap
    # or an exact pin would make this uninstallable alongside most clusters.
    # The vLLM example also needs 2.53, for a different reason; its README
    # covers that.
    "ray[data]>=2.53.0",
    "lancedb>=0.24.0",
    "lance-ray>=0.5.0",
    "pyarrow>=17.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "pytest-timeout>=2.3.0",
    "mypy>=1.11.0",
    "ruff>=0.8.0",
    "pandas>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/justinrmiller/lancedb-ray"
Repository = "https://github.com/justinrmiller/lancedb-ray"

[tool.setuptools.packages.find]
where = ["."]
include = ["lancedb_ray*"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["lancedb_ray", "tests", "examples", "benchmarks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "UP045", "UP007"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/test_benchmarks.py imports the benchmark suite, which lives at the repo
# root and is not part of the installed package.
pythonpath = ["."]
addopts = [
    "--cov=lancedb_ray",
    "--cov-report=term-missing",
    # Set just below where the suite actually sits, so a real
    # regression trips it but ordinary churn does not.
    "--cov-fail-under=95",
    # Ray forks workers and LanceDB's async runtime is only experimentally
    # fork-safe, so a task can deadlock. Fail the test with thread tracebacks
    # instead of stalling the run until the CI job is killed.
    "--timeout=300",
    "--timeout-method=thread",
]
markers = [
    "enterprise: live tests against a real LanceDB Cloud/Enterprise endpoint (needs LANCEDB_URI + LANCEDB_API_KEY)",
]

[tool.coverage.run]
source = ["lancedb_ray"]
# The benchmark suite is tooling, exercised by being run rather than by the
# unit tests, so it is not part of the coverage gate.
omit = ["*/tests/*", "*/benchmarks/*"]
# Line coverage alone hides half-tested conditionals: a branch whose true arm
# runs and whose false arm never does still counts every line as covered.
branch = true

[tool.mypy]
# No python_version pin: it must match the interpreter actually running mypy,
# because some installed stubs (numpy) use syntax newer than our floor.
# Ruff's target-version = "py312" is what enforces the language floor.
files = ["lancedb_ray", "tests", "examples", "benchmarks"]
# Test helpers and example modules are imported flat (not as tests.* or
# examples.*) because Ray workers load them that way, so mypy needs the same
# search path. Example module names are kept globally unique to match.
# ``benchmarks`` reuses the test suite's fake Cloud/Enterprise backend, which is
# imported flat (``_fakes``) because Ray workers load it that way.
mypy_path = ["tests", "examples/clip_image_search", "examples/vllm_generate_embed"]
strict = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "lancedb.*",
    "lance.*",
    "lance_ray.*",
    "ray.*",
    "pyarrow.*",
    "pandas.*",
    "psutil.*",
]
ignore_missing_imports = true

# The clip_image_search example's dependencies are deliberately not part of
# [dev]: they are large (torch alone is hundreds of MB) and only that one
# example needs them. Lint must therefore pass without them installed.
[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "PIL.*", "streamlit.*"]
ignore_missing_imports = true
